<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손글씨 숫자 인식 - 준비 중</title>
<style>
    :root {
        --bg-gradient-start: #667eea;
        --bg-gradient-end: #764ba2;
        --card-bg: #ffffff;
        --text-main: #2d2d2d;
        --text-muted: #6b6b6b;
        --accent: #667eea;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px;
    }

    .card {
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px 32px;
        width: 100%;
        max-width: 380px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 1.3rem;
        color: var(--text-main);
    }

    p {
        margin: 0 0 24px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    #statusMessage {
        margin-top: 16px;
        font-size: 0.9rem;
        color: var(--text-main);
        font-weight: 600;
    }

    .spinner {
        margin: 0 auto;
        width: 44px;
        height: 44px;
        border: 4px solid #eee;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <div class="card">
        <h1>손글씨 숫자 인식</h1>
        <p>서버를 준비하고 있습니다. 잠시만 기다려 주세요.</p>
        <div class="spinner"></div>
        <div id="statusMessage">{{ message }}</div>
    </div>

<script>
async function checkStatus() {
    try {
        const res = await fetch("/status");
        const data = await res.json();
        document.getElementById("statusMessage").textContent = data.message;
        if (data.ready) {
            window.location.reload();
            return;
        }
    } catch (err) {
        // Server may not be fully up yet; ignore and retry.
    }
    setTimeout(checkStatus, 1500);
}

checkStatus();
</script>
</body>
</html>
