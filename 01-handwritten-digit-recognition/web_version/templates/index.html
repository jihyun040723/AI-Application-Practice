<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손글씨 숫자 인식</title>

<meta property="og:title" content="손글씨 숫자 인식">
<meta property="og:description" content="MNIST로 학습한 신경망이 브라우저에서 직접 그린 손글씨 숫자를 실시간으로 인식합니다.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="description" content="MNIST로 학습한 신경망이 브라우저에서 직접 그린 손글씨 숫자를 실시간으로 인식합니다.">
<style>
    :root {
        --bg-gradient-start: #667eea;
        --bg-gradient-end: #764ba2;
        --card-bg: #ffffff;
        --text-main: #2d2d2d;
        --text-muted: #6b6b6b;
        --accent: #667eea;
        --danger: #e74c3c;
        --success: #2ecc71;
        --border: #e0e0e0;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 24px;
    }

    .card {
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 32px;
        width: 100%;
        max-width: 420px;
        text-align: center;
    }

    h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
        color: var(--text-main);
    }

    .subtitle {
        margin: 0 0 20px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    #canvas {
        border: 3px solid var(--border);
        border-radius: 12px;
        background: black;
        touch-action: none;
        cursor: crosshair;
        max-width: 100%;
    }

    .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 16px 0;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 10px 22px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active {
        transform: scale(0.96);
    }

    #clearBtn {
        background: #f1f1f1;
        color: var(--text-main);
    }

    #recognizeBtn {
        background: var(--accent);
        color: white;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .result {
        margin-top: 8px;
        min-height: 34px;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-main);
    }

    .predictions {
        margin-top: 16px;
        text-align: left;
    }

    .prediction-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .prediction-digit {
        width: 20px;
        font-weight: 700;
        color: var(--text-main);
    }

    .bar-track {
        flex: 1;
        background: #eee;
        border-radius: 6px;
        height: 14px;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #8b9bf0);
        border-radius: 6px;
        transition: width 0.4s ease;
    }

    .bar-fill.top {
        background: linear-gradient(90deg, #4b6cf0, #667eea);
    }

    .prediction-pct {
        width: 46px;
        text-align: right;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .hint {
        margin-top: 18px;
        font-size: 0.8rem;
        color: var(--text-muted);
        line-height: 1.5;
    }

    .status {
        font-size: 0.85rem;
        color: var(--text-muted);
        min-height: 20px;
    }

    kbd {
        background: #f1f1f1;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 0.8rem;
    }

    @keyframes shake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-8px); }
        40%, 60% { transform: translateX(8px); }
    }

    #canvas.canvas-error {
        border-color: var(--danger);
        animation: shake 0.4s ease;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>손글씨 숫자 인식</h1>
        <p class="subtitle">아래 캔버스에 0-9 숫자를 그려보세요</p>

        <canvas id="canvas" width="280" height="280"></canvas>

        <div class="buttons">
            <button id="clearBtn" type="button">지우기</button>
            <button id="recognizeBtn" type="button">인식하기</button>
        </div>

        <div class="result" id="resultText">숫자를 그리고 '인식하기'를 클릭하세요</div>
        <div class="status" id="statusText"></div>

        <div class="predictions" id="predictionsBox"></div>

        <p class="hint">
            팁: <kbd>Enter</kbd>키로 인식, <kbd>C</kbd>키로 지우기<br>
            마우스, 터치스크린, 스타일러스 모두 사용할 수 있습니다.
        </p>
    </div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const clearBtn = document.getElementById("clearBtn");
const recognizeBtn = document.getElementById("recognizeBtn");
const resultText = document.getElementById("resultText");
const statusText = document.getElementById("statusText");
const predictionsBox = document.getElementById("predictionsBox");

const BRUSH_SIZE = 16;
let isDrawing = false;
let lastX = null;
let lastY = null;
let hasDrawing = false;

function resetCanvas() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "white";
    ctx.fillStyle = "white";
    ctx.lineWidth = BRUSH_SIZE;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    hasDrawing = false;
    resultText.textContent = "숫자를 그리고 '인식하기'를 클릭하세요";
    statusText.textContent = "";
    predictionsBox.innerHTML = "";
}

function getPointerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = evt.touches ? evt.touches[0] : evt;
    return {
        x: (point.clientX - rect.left) * scaleX,
        y: (point.clientY - rect.top) * scaleY,
    };
}

function startDraw(evt) {
    evt.preventDefault();
    isDrawing = true;
    const { x, y } = getPointerPos(evt);
    lastX = x;
    lastY = y;
    ctx.beginPath();
    ctx.arc(x, y, BRUSH_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    hasDrawing = true;
}

function draw(evt) {
    if (!isDrawing) return;
    evt.preventDefault();
    const { x, y } = getPointerPos(evt);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    lastX = x;
    lastY = y;
    hasDrawing = true;
}

function stopDraw() {
    isDrawing = false;
    lastX = null;
    lastY = null;
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", draw);
window.addEventListener("mouseup", stopDraw);

canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchmove", draw, { passive: false });
canvas.addEventListener("touchend", stopDraw);

clearBtn.addEventListener("click", resetCanvas);

function flashCanvasError() {
    canvas.classList.remove("canvas-error");
    // Force a reflow so the animation can retrigger on repeated errors.
    void canvas.offsetWidth;
    canvas.classList.add("canvas-error");
}

canvas.addEventListener("animationend", () => {
    canvas.classList.remove("canvas-error");
});

async function recognize() {
    if (!hasDrawing) {
        resultText.textContent = "먼저 숫자를 그려주세요";
        flashCanvasError();
        return;
    }

    recognizeBtn.disabled = true;
    statusText.textContent = "예측 중...";

    try {
        const dataUrl = canvas.toDataURL("image/png");
        const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: dataUrl }),
        });

        const data = await response.json();

        if (!response.ok) {
            resultText.textContent = data.error || "예측에 실패했습니다";
            statusText.textContent = "";
            predictionsBox.innerHTML = "";
            flashCanvasError();
            return;
        }

        resultText.textContent = `예측 숫자: ${data.digit}`;
        statusText.textContent = `신뢰도: ${data.confidence}%`;

        predictionsBox.innerHTML = data.top_predictions.map((p, idx) => `
            <div class="prediction-row">
                <span class="prediction-digit">${p.digit}</span>
                <div class="bar-track">
                    <div class="bar-fill ${idx === 0 ? 'top' : ''}" style="width: ${p.confidence}%"></div>
                </div>
                <span class="prediction-pct">${p.confidence}%</span>
            </div>
        `).join("");
    } catch (err) {
        resultText.textContent = "서버 연결 오류가 발생했습니다";
        statusText.textContent = String(err);
        flashCanvasError();
    } finally {
        recognizeBtn.disabled = false;
    }
}

recognizeBtn.addEventListener("click", recognize);

document.addEventListener("keydown", (evt) => {
    if (evt.key === "Enter") recognize();
    if (evt.key.toLowerCase() === "c") resetCanvas();
});

resetCanvas();
</script>
</body>
</html>
