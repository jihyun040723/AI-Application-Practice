<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks - Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- ===== Sidebar ===== -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>☰ My Tasks</h1>
                <label class="theme-toggle" title="다크/라이트 모드 전환 (Alt+D)">
                    <input type="checkbox" id="themeToggle">
                    <span class="toggle-slider"></span>
                </label>
            </header>

            <nav class="side-section" aria-label="카테고리">
                <h2 class="side-title">카테고리</h2>
                <div class="filter-row" id="filterRow">
                    <button class="filter-btn active" data-filter="all"><span>전체</span> <span class="filter-count" id="countAll">0</span></button>
                    <button class="filter-btn" data-filter="work"><span><i class="dot work"></i>업무</span> <span class="filter-count" id="countWork">0</span></button>
                    <button class="filter-btn" data-filter="personal"><span><i class="dot personal"></i>개인</span> <span class="filter-count" id="countPersonal">0</span></button>
                    <button class="filter-btn" data-filter="study"><span><i class="dot study"></i>공부</span> <span class="filter-count" id="countStudy">0</span></button>
                </div>
            </nav>

            <section class="side-section">
                <h2 class="side-title">진행률</h2>
                <div class="overall-progress">
                    <div class="progress-value" id="overallProgressText">0/0 완료 (0%)</div>
                    <div class="progress-track">
                        <div class="progress-fill" id="overallProgressFill"></div>
                    </div>
                </div>
                <div class="category-stats" id="categoryStats"></div>
                <div class="today-count">
                    <span class="dashboard-label">오늘 추가</span>
                    <span class="today-count-value" id="todayCount">0개</span>
                </div>
            </section>

            <section class="side-section">
                <h2 class="side-title">데이터 관리</h2>
                <div class="side-buttons">
                    <button id="exportBtn" type="button">⬇ 데이터 내보내기</button>
                    <button id="importBtn" type="button">⬆ 데이터 가져오기</button>
                    <input type="file" id="importFile" accept=".json" hidden>
                    <button id="reclassifyBtn" type="button">🏷 자동 재분류</button>
                    <button id="categorySettingsBtn" type="button">⚙ 분류 설정</button>
                    <button id="clearCompletedBtn" type="button" class="danger">🗑 완료 항목 삭제</button>
                </div>
            </section>

            <section class="side-section shortcuts">
                <h2 class="side-title">단축키</h2>
                <dl>
                    <div><dt>Alt + N</dt><dd>할 일 추가</dd></div>
                    <div><dt>Ctrl + /</dt><dd>검색 포커스</dd></div>
                    <div><dt>Alt + D</dt><dd>다크 모드</dd></div>
                    <div><dt>Alt + 1~4</dt><dd>카테고리 전환</dd></div>
                </dl>
            </section>
        </aside>

        <!-- ===== Main ===== -->
        <main class="main">
            <div class="daily-quote" id="dailyQuote"></div>

            <div class="toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="할 일 검색... (Ctrl+/)">
                </div>
                <div class="sort-box">
                    <label for="sortSelect">정렬:</label>
                    <select id="sortSelect">
                        <option value="date-desc">최신순</option>
                        <option value="date-asc">오래된순</option>
                        <option value="category">카테고리순</option>
                        <option value="completed">완료 상태순</option>
                        <option value="dueDate">마감일순</option>
                    </select>
                </div>
            </div>

            <div class="add-panel">
                <div class="add-row">
                    <select id="categorySelect">
                        <option value="work">업무</option>
                        <option value="personal">개인</option>
                        <option value="study">공부</option>
                    </select>
                    <input type="text" id="taskInput" placeholder="할 일을 입력하세요... (Enter로 추가)" maxlength="100">
                    <button id="addBtn" type="button">+ 추가</button>
                </div>
                <div class="suggest-bar" id="suggestBar" hidden>
                    <span class="suggest-text" id="suggestText"></span>
                    <button type="button" id="suggestApply" class="suggest-apply">적용</button>
                    <button type="button" id="suggestIgnore" class="suggest-ignore">무시</button>
                </div>
                <div class="add-row-extra">
                    <label>마감일 <input type="date" id="dueDateInput"></label>
                    <label>반복
                        <select id="repeatSelect">
                            <option value="none">없음</option>
                            <option value="daily">매일</option>
                            <option value="weekly">매주</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="list-heading">
                <h2 id="listTitle">전체 할 일</h2>
                <span class="list-count" id="listCount">0개</span>
            </div>

            <ul class="task-list" id="taskList"></ul>

            <div class="empty-state" id="emptyState" hidden>할 일이 없습니다. 추가해보세요!</div>
        </main>
    </div>

<script src="script.js"></script>
</body>
</html>
